# Generic exact-computation suite.
#
# Exists to answer one question the grounding suite cannot: when an answer needs arithmetic,
# does BrowserAgent reach for the deterministic operation, or does it do the sum in the
# model's head? The grounding suite has a single arithmetic task, so a change there is
# indistinguishable from that one task's quirks. These are deliberately worded *unlike*
# `comparison-with-arithmetic` — different operations, different figures, different phrasings,
# and none of them reuses its sentence shape — so a pass here means the compute path works
# rather than that one benchmark sentence has been learned.
#
# The operands are deliberately all reachable from the start page. That is not to make the
# tasks easy: it is to isolate the thing under test. A run that never finds the second figure
# fails for want of an operand, which says nothing about whether it would have computed with
# one, and an earlier draft of this suite measured mostly that.
#
# Every task states `requires_computation`, which fails any answer whose arithmetic was not
# done by `agent_v2/compute.py`, however right the number happens to be.
#
# Every task also states the answer it must actually reach. Without that this suite grades
# only grounding hygiene, and a run that confidently reports the wrong total scores exactly
# as well as one that reports the right one — which is how a trial answering £45.30 to a
# question whose answer is £74.80 was recorded as FULL_SUCCESS. `answer_matches` is the
# correctness gate; `outcome` remains the separate, honesty gate. A run that cannot find a
# figure and says so plainly fails the former and passes the latter, which is the ranking
# V2 hardening §29 asks for.

tasks:
  - id: subtract-two-prices
    capability: exact arithmetic
    goal: >-
      Using the figures shown on this listing page, work out the exact gap between what
      'Sharp Objects' costs and what 'Soumission' costs.
    start_url: "https://books.toscrape.com/"
    max_steps: 24
    expect:
      requires_computation: true
      min_evidence: 2
      no_unsupported_claims: true
      # Sharp Objects 47.82, Soumission 50.10. Either sign is a correct reading of "gap".
      answer_matches: "2\.28"

  - id: add-two-prices
    capability: exact arithmetic
    goal: >-
      From the figures on this listing page, if someone took both 'The Requiem Red' and
      'The Black Maria', what would the pair of them come to altogether?
    start_url: "https://books.toscrape.com/"
    max_steps: 24
    expect:
      requires_computation: true
      min_evidence: 2
      no_unsupported_claims: true
      # The Requiem Red 22.65 + The Black Maria 52.15.
      answer_matches: "74\.80|74\.8\b"
      # The failure this suite was blind to: both books read as 22.65.
      answer_not_matches: "45\.30|45\.3\b"

  - id: cheapest-of-three
    capability: selection by computed order
    goal: >-
      Three titles on this listing page — 'Olio', 'Starving Hearts' and 'Set Me Free'.
      Establish which of the three carries the lowest figure, and say what that figure is.
    start_url: "https://books.toscrape.com/"
    max_steps: 24
    expect:
      requires_computation: true
      min_evidence: 2
      no_unsupported_claims: true
      # Olio 23.88, Starving Hearts 13.99, Set Me Free 17.46.
      answer_matches: "13\.99"
      answer_not_matches: "(23\.88|17\.46)[^0-9]*$"

  - id: percentage-between-prices
    capability: percentage arithmetic
    goal: >-
      Taking the figures shown on this listing page for 'Set Me Free' and for
      'Rip it Up and Start Again', express the difference between them as a percentage
      rather than as an absolute amount.
    start_url: "https://books.toscrape.com/"
    max_steps: 26
    expect:
      requires_computation: true
      min_evidence: 2
      no_unsupported_claims: true
      # Set Me Free 17.46, Rip it Up and Start Again 35.02. Which is the base is genuinely
      # open in the wording, so both readings of "the difference as a percentage" count.
      answer_matches: "100\.5|100\.6|50\.1|50\.2"

  - id: years-between-documents
    capability: date arithmetic
    goal: >-
      RFC 1945 and RFC 2068 each carry a publication date on rfc-editor.org. Establish both
      dates, then work out how far apart in time the two documents are.
    start_url: "https://www.rfc-editor.org/rfc/rfc1945.txt"
    max_steps: 24
    expect:
      requires_computation: true
      min_visited_sources: 2
      no_unsupported_claims: true
      # RFC 1945 is May 1996 and RFC 2068 is January 1997: eight months apart.
      answer_matches: "8 months|eight months"
      # The reading the runs actually produced, by adding a year that is not there.
      answer_not_matches: "1 year and 8|1 year, 8|20 months"
