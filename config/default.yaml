model:
  backend: "llama_cpp"  # "llama_cpp" or "ollama"
  endpoint: "http://127.0.0.1:8080"
  model_name: "qwen3-8b"
  temperature: 0.1
  context_window: 8192
  max_output_tokens: 256
  max_output_tokens_deep_recovery: 512
  request_timeout_s: 30

browser:
  headless: false
  user_data_dir: "./runtime/tasks"   # actual profile: {user_data_dir}/{task_id}/browser_profile
  action_timeout_ms: 10000
  interactive_approval: true          # prompt on CLI before CONSEQUENTIAL actions

context:
  max_page_chars: 3000
  max_page_chars_deep_recovery: 6000
  recent_actions: 5
  max_visible_text_items: 12

recovery:
  max_action_retries: 2
  identical_action_limit: 3
  navigation_cycle_limit: 2
  verification_retry_limit: 2

storage:
  tasks_dir: "./runtime/tasks"

logging:
  level: "INFO"
  dir: "./runtime/logs"
  redact_secrets: true
