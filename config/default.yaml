model:
  backend: "ollama"  # "ollama" or "llama_cpp"
  endpoint: ""       # optional override; otherwise backend-specific endpoint below is used
  ollama_endpoint: "http://127.0.0.1:11434"
  llamacpp_endpoint: "http://127.0.0.1:8080"
  model_name: "qwen3:8b"
  temperature: 0.1
  context_window: 8192
  max_output_tokens: 256
  max_output_tokens_deep_recovery: 512
  request_timeout_s: 30
  request_connect_timeout_s: 10
  request_write_timeout_s: 10
  request_pool_timeout_s: 10
  max_inference_attempts: 2
  inference_retry_backoff_s: 0.5
  ollama_keep_alive: "5m"

browser:
  headless: false
  user_data_dir: "./runtime/tasks"   # actual profile: {user_data_dir}/{task_id}/browser_profile
  action_timeout_ms: 10000
  interactive_approval: true          # prompt on CLI before CONSEQUENTIAL actions
  mode: "launch"                      # "launch" or "cdp_attach" — default stays "launch" for
                                       # tests/fixtures; everyday use may set "cdp_attach"
  cdp_endpoint: "http://127.0.0.1:9222"  # only used when mode: "cdp_attach"

context:
  max_page_chars: 3000
  max_page_chars_deep_recovery: 6000
  recent_actions: 5
  max_visible_text_items: 12
  max_total_tokens: 4096
  recent_window_tokens: 800
  summary_tokens: 500
  retrieved_memory_tokens: 500
  page_tokens: 1400
  retrieved_memory_top_k: 5
  enable_running_summary: true
  enable_memory_retrieval: true
  enable_active_facts: true
  active_fact_tokens: 300
  enforce_active_fact_constraints: false
  summary_rebuild_interval: 4

recovery:
  max_action_retries: 2
  identical_action_limit: 3
  navigation_cycle_limit: 2
  verification_retry_limit: 2

storage:
  runtime_dir: "./runtime"
  tasks_dir: "./runtime/tasks"

logging:
  level: "INFO"
  dir: "./runtime/logs"
  redact_secrets: true
