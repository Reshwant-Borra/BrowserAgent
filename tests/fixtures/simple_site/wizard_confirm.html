<!doctype html>
<html>
<head><meta charset="utf-8"><title>Wizard — Confirmation</title></head>
<body>
  <h1>Confirmation</h1>
  <p>Review your application before submitting.</p>
  <button id="submit-application" onclick="doSubmit()">Submit Application</button>
  <p id="submit-status"></p>
  <script>
    let submitCount = 0;
    function doSubmit() {
      submitCount += 1;
      document.getElementById('submit-status').textContent = 'Submitted ' + submitCount + ' time(s)';
      // Deliberately NOT disabling the button here: this fixture exists to prove the
      // *agent's* idempotency policy (agent/recovery.py) refuses to auto-retry a failed
      // consequential action, rather than relying on the page itself to prevent a resubmit.
    }
  </script>
</body>
</html>
