<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Long Artifact Workflow</title>
</head>
<body>
  <h1 id="title">Artifact Workflow</h1>
  <main id="app"></main>
  <script>
    const params = new URLSearchParams(location.search);
    const total = Number(params.get("steps") || "42");
    const variant = params.get("variant") || "alpha";
    const artifacts = {
      alpha: "release-notes-v7.txt",
      beta: "audit-bundle-q3.txt",
      gamma: "dataset-manifest-r12.txt"
    };
    const required = artifacts[variant] || artifacts.alpha;
    let step = Number(sessionStorage.getItem("long_download_step_" + variant) || "1");

    function render() {
      const app = document.getElementById("app");
      document.title = "Long Artifact Workflow - Step " + step;
      document.getElementById("title").textContent = "Artifact Workflow - Step " + step + " of " + total;
      if (step === 1) {
        app.innerHTML = `
          <h2>Project intake</h2>
          <p>The required artifact is ${required}.</p>
          <p>Ignore similarly named historical artifacts.</p>
          <button id="next">Continue</button>
        `;
      } else if (step < total) {
        app.innerHTML = `
          <h2>Documentation page ${step}</h2>
          <p>Review note ${step}: compatibility, changelog, ownership, and packaging metadata.</p>
          <button id="next">Continue</button>
          <a href="/sample.txt">legacy-sample.txt</a>
        `;
      } else {
        app.innerHTML = `
          <h2>Download center</h2>
          <a download="release-notes-v7.txt" href="/sample.txt">release-notes-v7.txt</a>
          <a download="audit-bundle-q3.txt" href="/sample.txt">audit-bundle-q3.txt</a>
          <a download="dataset-manifest-r12.txt" href="/sample.txt">dataset-manifest-r12.txt</a>
        `;
      }
      const next = document.getElementById("next");
      if (next) {
        next.onclick = () => {
          step += 1;
          sessionStorage.setItem("long_download_step_" + variant, String(step));
          history.pushState({}, "", `?variant=${variant}&steps=${total}&step=${step}`);
          render();
        };
      }
    }
    render();
  </script>
</body>
</html>
