<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Parts Catalogue</title></head>
<body>
  <h1>Parts Catalogue</h1>

  <!-- Cards: each name and its price live in one list item, the way a product listing is
       built. This is what makes "Bolt Carrier costs $52.15" checkable. -->
  <ul>
    <li><article><h3><a href="identity_bolt.html" title="Bolt Carrier">Bolt Carrier</a></h3>
      <div><p>$22.65</p><p>In stock</p></div></article></li>
    <li><article><h3><a href="identity_gasket.html" title="Gasket Ring">Gasket Ring</a></h3>
      <div><p>$52.15</p><p>In stock</p></div></article></li>
    <li><article><h3><a href="identity_spindle.html" title="Spindle Housing">Spindle Housing</a></h3>
      <div><p>$13.99</p><p>In stock</p></div></article></li>
  </ul>

  <!-- Rows: the observer emits a <tr> as one "cell | cell" line, so the leading cell names
       the thing and the rest are its values. -->
  <table>
    <tr><th>Supplier</th><th>Rating</th></tr>
    <tr><td>Northwind Depot</td><td>4.62</td></tr>
    <tr><td>Eastvale Supply</td><td>3.71</td></tr>
  </table>

  <!-- Label above value: a <dt>/<dd> pair, which the observer emits as two adjacent items. -->
  <dl>
    <dt>Catalogue revised</dt><dd>2024-01-05</dd>
    <dt>Schema version</dt><dd>3.12.1</dd>
  </dl>
</body>
</html>
