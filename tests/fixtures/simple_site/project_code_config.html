<!doctype html>
<html>
<head><meta charset="utf-8"><title>Configuration</title></head>
<body>
  <h1>Configuration</h1>
  <label for="code">Enter project code</label>
  <input type="text" id="code" />
  <button id="verify" onclick="doVerify()">Verify</button>
  <p id="verify-status"></p>
  <script>
    const EXPECTED = "XK-4471";
    function doVerify() {
      const val = document.getElementById('code').value.trim();
      document.getElementById('verify-status').textContent =
        (val === EXPECTED) ? "Verified: code accepted" : "Error: code does not match";
    }
  </script>
</body>
</html>
